name: LEDE X86_64 固件自动编译

# ==============================================================================
# 触发方式：仅允许手动触发（workflow_dispatch），已关闭所有自动触发
# ==============================================================================
on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 固件默认主机名
        required: false
        default: OpenWrt
        type: string
      release:
        description: 编译成功后发布到 GitHub Releases
        required: false
        default: true
        type: boolean
      use_cache:
        description: 启用 DL 依赖缓存加速编译
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai                      # 时区固定 Asia/Shanghai
  SOURCE_URL: https://github.com/coolsnowwolf/lede
  SOURCE_BRANCH: master                  # 固定拉取 master 分支
  TARGET_KERNEL: "6.12"                  # 强制 X86 内核主线版本
  LAN_IP: "192.168.2.1"                  # 默认后台 IP
  ROOT_PASSWORD: ""                      # 默认密码留空
  DEFAULT_THEME: argon                   # 默认主题 Argon
  TZ_NAME: Asia/Shanghai
  TZ_CODE: CST-8
  OPENWRT_ROOT: ${{ github.workspace }}/lede
  BUILDER_ROOT: ${{ github.workspace }}/builder

jobs:
  build:
    name: 编译 X86_64 / squashfs 固件
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ---------------------------------------------------------------- 准备
      - name: 检出构建工程
        uses: actions/checkout@v4
        with:
          path: builder

      - name: 初始化运行环境（时区 / 主机名入参 / 磁盘信息）
        run: |
          sudo timedatectl set-timezone "$TZ" || true
          echo "FW_HOSTNAME=${{ inputs.hostname }}" >> "$GITHUB_ENV"
          echo "编译开始时间：$(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "目标内核：${TARGET_KERNEL} / 后台 IP：${LAN_IP} / 主题：${DEFAULT_THEME}"
          df -h / | tail -1

      - name: 安装编译依赖（Ubuntu 24.04 LTS）
        run: |
          sudo apt-get update -y
          # 核心依赖：缺失即失败
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget patch pkgconf python3
          # 扩展依赖：个别包在 24.04 上改名或不存在，缺失不阻断主流程
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bzip2 ccache cmake cpio \
            device-tree-compiler ecj fastjar gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp-dev libltdl-dev \
            libmpc-dev libmpfr-dev libpython3-dev libreadline-dev libtool lrzsz \
            msmtp ninja-build p7zip-full python3-pyelftools qemu-utils scons \
            squashfs-tools subversion texinfo uglifyjs upx-ucl xmlto xxd || true
          gcc --version | head -1

      - name: 释放磁盘空间（避免编译中途空间不足）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift || true
          df -h / | tail -1

      # ---------------------------------------------------------------- 源码
      - name: 拉取 LEDE 源码（固定 master 分支，浅克隆）
        run: |
          git clone --depth=1 --branch "$SOURCE_BRANCH" "$SOURCE_URL" "$OPENWRT_ROOT"
          cd "$OPENWRT_ROOT"
          echo "源码提交：$(git rev-parse --short HEAD)"
          echo "源码分支：$(git rev-parse --abbrev-ref HEAD)"

      - name: 载入 DL 下载缓存（加速编译）
        if: ${{ inputs.use_cache }}
        uses: actions/cache@v4
        with:
          path: ${{ env.OPENWRT_ROOT }}/dl
          key: lede-dl-ubuntu2404-x86-64
          restore-keys: |
            lede-dl-ubuntu2404-x86-

      # ---------------------------------------------------------------- 配置
      - name: 初始化 Feeds（大雕软件源，批量更新安装并扫描成果）
        run: bash "$BUILDER_ROOT/scripts/01-init-env.sh"

      - name: 强制切换 X86 内核到 6.12 并打印内核版本
        run: bash "$BUILDER_ROOT/scripts/02-kernel-6.12.sh"

      - name: 拉取第三方插件（多级源优先级 + 批量预拉 + 差分补漏）
        run: bash "$BUILDER_ROOT/scripts/03-fetch-plugins.sh"

      - name: 应用固件默认设置（IP / 空密码 / 时区 / 主题 / 清除预设）
        run: bash "$BUILDER_ROOT/scripts/04-defaults.sh"

      - name: 生成编译配置并严格校验插件完整性
        run: bash "$BUILDER_ROOT/scripts/05-configure.sh"

      # ---------------------------------------------------------------- 编译
      - name: 编译固件（严格模式：任意包报错立即终止）
        run: bash "$BUILDER_ROOT/scripts/06-build.sh"

      - name: 校验产物（文件 / 格式 / 分区容量 / 内核版本）并生成发布说明
        run: bash "$BUILDER_ROOT/scripts/07-verify.sh"

      # ---------------------------------------------------------------- 产物
      - name: 上传失败日志（仅 ERROR 摘要，避免日志过载）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ERROR-编译失败日志
          path: ${{ env.OPENWRT_ROOT }}/build-error.log
          if-no-files-found: ignore

      - name: 上传固件到 Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LEDE-X86_64-固件
          path: ${{ env.OPENWRT_ROOT }}/upload/*.img.gz
          if-no-files-found: error

      - name: 创建 GitHub Release 并上传 img.gz
        if: ${{ success() && inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$OPENWRT_ROOT"
          TAG="LEDE-x86_64-$(date '+%Y%m%d-%H%M%S')"
          echo "发布标签：$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            upload/*.img.gz
