name: Build ImmortalWrt X86_64

# ============================================================================
# 工作流说明
# - 手动触发（workflow_dispatch），支持选择是否清空 dl 缓存重新下载
# - 基于 Ubuntu 22.04 环境，拉取 ImmortalWrt openwrt-24.10 源码
# - 仅编译 x86_64 架构，仅生成 squashfs combined IMG 镜像
# - 编译采用严格模式：任一软件包失败立即终止整个编译，避免"工作流成功但固件缺插件"
# - 编译失败自动上传完整编译日志用于排错
# - 编译成功自动创建 GitHub Release 并仅上传 squashfs-combined.img
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      clean_dl_cache:
        description: '是否清空 dl 缓存（重新下载全部源码与软件包）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # 允许自动创建 Release 并上传产物

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    name: 编译 X86_64 固件
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ======================================================================
      # 步骤 1：校验仓库并同步源码
      # 目的：将当前云编译仓库检出到工作区，供后续读取 config 与脚本
      # ======================================================================
      - name: 检出云编译仓库
        uses: actions/checkout@v4

      # ======================================================================
      # 步骤 2：设置构建环境（磁盘空间 + 依赖）
      # 目的：安装 OpenWrt 编译所需系统依赖，并清理 GitHub 运行器上可能存在的
      #       残余工具链以释放磁盘空间，避免因磁盘不足导致编译失败
      # ======================================================================
      - name: 清理运行器并释放磁盘空间
        run: |
          # 清理预装的大型工具链，释放磁盘空间
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get -y full-upgrade
          sudo apt-get -y install \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-pip python3-setuptools \
            rsync unzip zlib1g-dev file wget curl \
            libelf-dev libfuse-dev libsquashfs-dev squashfs-tools \
            quilt ccache xz-utils
          sudo timedatectl set-timezone "$TZ" || true

      # ======================================================================
      # 步骤 3：克隆 ImmortalWrt 源码
      # 目的：拉取 openwrt-24.10 分支源码；若上游分支变更导致拉取失败，立即终止
      # ======================================================================
      - name: 克隆 ImmortalWrt openwrt-24.10 源码
        run: |
          echo ">>> 拉取源码：${REPO_URL} 分支 ${REPO_BRANCH}"
          git clone --depth=1 --single-branch --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo ">>> 源码版本信息："
          git log -1 --oneline

      # ======================================================================
      # 步骤 4：恢复 dl 缓存
      # 目的：从缓存中恢复已下载的源码与软件包，减少重复下载、缩短编译耗时
      # ======================================================================
      - name: 恢复 dl 下载缓存
        id: dl_cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-cache-x86_64-${{ runner.os }}-${{ hashFiles('openwrt/include/kernel-version.mk') }}

      # ======================================================================
      # 步骤 5：更新 feeds 并拉取第三方插件
      # 目的：执行 feeds_update.sh，更新官方 feeds 源 + 浅克隆第三方插件目录；
      #       脚本内任意一步失败即退出，并输出明确的缺失项与来源仓库信息
      # ======================================================================
      - name: 更新 feeds 源与第三方插件
        run: |
          cd openwrt
          # 将云编译仓库中的脚本复制到源码根目录执行
          cp "$GITHUB_WORKSPACE/scripts/feeds_update.sh" ./feeds_update.sh
          chmod +x ./feeds_update.sh
          bash ./feeds_update.sh

      # ======================================================================
      # 步骤 6：加载仓库内置 config
      # 目的：使用 config/X86_64.config 作为 .config 种子，支持用户自行增删插件；
      #       随后展开为完整 .config 并补齐缺省项
      # ======================================================================
      - name: 加载 config/X86_64.config
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/config/X86_64.config" .config
          # 用 defconfig 方式展开为完整配置，缺省项自动补全
          make defconfig

      # ======================================================================
      # 步骤 7：应用系统配置修改
      # 目的：执行独立的 custom_settings.sh，设置 LAN IP、登录密码、主机名、时区、默认主题
      # ======================================================================
      - name: 应用系统配置修改
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/scripts/custom_settings.sh" ./custom_settings.sh
          chmod +x ./custom_settings.sh
          bash ./custom_settings.sh

      # ======================================================================
      # 步骤 8：下载全部软件包源码
      # 目的：预下载所有需要编译的软件包源码到 dl 目录，便于缓存并提前暴露下载失败
      # ======================================================================
      - name: 预下载软件包源码
        run: |
          cd openwrt
          make download -j$(nproc) V=s

      # ======================================================================
      # 步骤 9：编译固件（严格模式）
      # 目的：单线程编译（-j1）严格模式，任一软件包编译失败立即终止整个流程，
      #       避免出现"工作流显示成功但固件缺失插件"的隐蔽问题；
      #       关闭 IGNORE_ERRORS 保证不跳过任何失败项
      # ======================================================================
      - name: 编译固件（严格模式，失败即终止）
        run: |
          cd openwrt
          make -j1 V=s IGNORE_ERRORS=0

      # ======================================================================
      # 步骤 10：收集产物并过滤
      # 目的：仅保留 squashfs-combined.img，过滤 vhdx/vmdk/qcow2/vdi/iso 等多余产物；
      #       同时提取固件信息（内核版本、固件版本、插件清单）供 Release 使用
      # ======================================================================
      - name: 收集并过滤编译产物
        id: collect
        run: |
          cd openwrt
          mkdir -p "$GITHUB_WORKSPACE/release"
          IMG=$(find bin/targets -name '*squashfs-combined.img' | head -n1)
          if [ -z "$IMG" ]; then
            echo ">>> 未找到 squashfs-combined.img 产物，编译可能未成功。"
            exit 1
          fi
          cp "$IMG" "$GITHUB_WORKSPACE/release/"
          IMG_NAME=$(basename "$IMG")
          echo ">>> 产物：${IMG_NAME}"
          echo "img_name=${IMG_NAME}" >> "$GITHUB_OUTPUT"

          # 提取内核版本
          KERNEL_VER=$(grep -E '^CONFIG_LINUX_VERSION|LINUX_VERSION' .config 2>/dev/null | head -n1 | cut -d= -f2)
          [ -z "$KERNEL_VER" ] && KERNEL_VER=$(make kernelversion 2>/dev/null || echo "6.6")
          echo "kernel_ver=${KERNEL_VER}" >> "$GITHUB_OUTPUT"

          # 提取固件版本
          FW_VER=$(grep -E '^CONFIG_VERSION_NUMBER=' .config | cut -d= -f2 | tr -d '"')
          echo "fw_ver=${FW_VER}" >> "$GITHUB_OUTPUT"

          # 提取插件清单（仅列出应用类插件，过滤 kmod 内核模块驱动依赖）
          grep -E '^CONFIG_PACKAGE_luci-app-|^CONFIG_PACKAGE_luci-theme-|^CONFIG_PACKAGE_smartdns=|^CONFIG_PACKAGE_adguardhome=|^CONFIG_PACKAGE_easytier=|^CONFIG_PACKAGE_mwan3=|^CONFIG_PACKAGE_nlbwmon=' .config \
            | grep '=y' \
            | sed -E 's/^CONFIG_PACKAGE_(luci-app-[^=]+|luci-theme-[^=]+|[^=]+)=y/\1/' \
            | sort -u > "$GITHUB_WORKSPACE/release/packages.txt"
          echo ">>> 插件清单："
          cat "$GITHUB_WORKSPACE/release/packages.txt"

      # ======================================================================
      # 步骤 11：保存 dl 缓存
      # 目的：把本次下载的源码与软件包回写到缓存，供下次编译复用
      # ======================================================================
      - name: 保存 dl 下载缓存
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-cache-x86_64-${{ runner.os }}-${{ hashFiles('openwrt/include/kernel-version.mk') }}

      # ======================================================================
      # 步骤 12：创建 Release 并上传固件
      # 目的：编译成功后自动创建 GitHub Release，仅上传 squashfs-combined.img；
      #       Release 说明自动填充 LAN IP、登录账号密码、内核版本、固件版本、插件清单
      # ======================================================================
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REPO_BRANCH }}-${{ github.run_number }}
          name: ImmortalWrt 24.10 X86_64 (Build ${{ github.run_number }})
          files: release/*.img
          body: |
            ## 固件信息

            - **LAN IP**：`192.168.2.1`
            - **登录账号**：`root`
            - **登录密码**：`12345678`
            - **内核版本**：`${{ steps.collect.outputs.kernel_ver }}`
            - **固件版本**：`${{ steps.collect.outputs.fw_ver }}`

            ## 已安装插件清单

            ```
            $(cat release/packages.txt)
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ======================================================================
      # 步骤 13：编译失败时上传完整日志
      # 目的：若前面任一步骤失败，自动上传完整编译日志，用于排查错误与 Bug
      # ======================================================================
      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            openwrt/logs/
            openwrt/*.log
          retention-days: 14
          if-no-files-found: warn
