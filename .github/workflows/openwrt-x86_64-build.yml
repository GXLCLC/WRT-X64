# ==========================================================================
#  OpenWrt(lede) X86_64 云编译工作流
# --------------------------------------------------------------------------
#  这个文件做什么：
#    在 GitHub 服务器(Ubuntu 22.04)上全自动编译 OpenWrt 固件：
#    拉取 lede 最新源码 -> 应用自定义 config -> 编译 -> 自动发布 Release
#
#  怎么用：
#    1. 增删插件：只改 config/x86_64.config 文件即可，不用动本文件
#    2. 开始编译：仓库顶部 Actions 页 -> 选中"云编译 OpenWrt X86_64 固件"
#       -> 点击 "Run workflow" 按钮
#    3. 编译完成后：到仓库 Releases 页面下载 .img.gz 镜像（解压即得 .img）
#
#  小知识：
#    GitHub 公共仓库的 Actions 完全免费，单次任务最长 6 小时，
#    本编译约 2~4 小时，完全够用。
# ==========================================================================
name: 云编译 OpenWrt X86_64 固件

# ----------------------- 什么时候触发编译 -----------------------
on:
 # 手动触发：在 Actions 页面点击 "Run workflow"
  workflow_dispatch:
 # 想每天自动编译一次？删掉下面两行的 # 注释即可
 # schedule:
 #   - cron: '0 18 * * *'        # UTC 18:00 = 北京时间凌晨 2 点

# ----------------------- 全局变量 -----------------------
# 注意：固件 LAN IP / 账号 / 密码 / 语言 这些"定制项"不在改这里，
#       而是改 scripts/customize.sh 文件（一个专门负责定制的脚本）。
#       这里只保留编译流程本身需要的变量。
env:
  REPO_URL: https://github.com/coolsnowwolf/lede                 # OpenWrt lede 源码地址
  REPO_BRANCH: master                                            # 跟踪 lede 的 master 分支(最新)
  CONFIG_FILE: config/x86_64.config                              # 你的自定义配置文件位置
  KENZOK8_FEED: https://github.com/kenzok8/openwrt-packages      # 第三方源(ddnsto 在这里)
  OPENAPPFILTER_URL: https://github.com/destan19/OpenAppFilter   # 应用过滤插件(独立仓库)
  TZ: Asia/Shanghai          # 让日志时间显示北京时间

# 允许本工作流创建 Release（发布固件需要写仓库权限）
permissions:
  contents: write

jobs:
  build:
    # ---------- 编译机系统：按要求使用 Ubuntu 22.04 ----------
    # 注意：GitHub 已宣布 ubuntu-22.04 于 2026-09-17 开始弃用，2027-04-17 完全退役。
    #       到时候只需把下面一行改成 ubuntu-24.04，其余步骤无需改动。
    runs-on: ubuntu-22.04

    steps:
      # ============ 第 1 步：检出本仓库代码 ============
      # 目的：拿到 config/x86_64.config 自定义配置文件
      - name: 检出本仓库代码
        uses: actions/checkout@v4

      # ============ 第 2 步：初始化编译环境 ============
      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive   # apt 交互提问全部自动应答，避免流程卡住
        run: |
          # 把系统时区改成北京时间，日志时间看起来更直观
          sudo timedatectl set-timezone "$TZ"
          # 打印系统版本，确认确实运行在 Ubuntu 22.04 上
          lsb_release -a || cat /etc/os-release

      # ============ 第 3 步：清理预装软件，腾出磁盘空间 ============
      # 原因：OpenWrt 完整编译需要约 35GB 空间，GitHub 默认镜像预装了
      #       .NET / Android SDK / GHC / CodeQL 等大块头，删掉可多出约 40GB
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* \
                      /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          # 清空 Docker 预装镜像（本次编译用不到）
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          # 打印当前磁盘剩余空间，确认清理效果
          df -hT

      # ============ 第 4 步：安装编译依赖 ============
      # 这是 lede 官方 README 给出的 Ubuntu 依赖清单
      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev \
            libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz \
            genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd \
            libfuse-dev libnsl-dev libncurses5-dev zlib1g-dev zstd

      # ============ 第 5 步：拉取 lede 最新源码 ============
      # --depth 1 是"浅克隆"：只取最新一次提交，下载量小、速度快
      - name: 拉取 lede 最新源码
        run: |
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          # 打印当前源码版本（提交时间 + 提交号），稍后也会写进发布页
          git -C openwrt log -1 --format='源码版本: lede master @ %cd (%h)' --date=format:'%Y-%m-%d %H:%M'

      # ============ 第 6 步：添加第三方软件源(feeds) ============
      # 原因：DDNSTO 不在 lede 内置软件源里，kenzok8 的第三方源里才有
      - name: 添加第三方软件源
        run: |
          cd openwrt
          # 追加 kenzok8 源（含 ddnsto、luci-app-ddnsto 等常用插件）
          echo "src-git kenzok8 $KENZOK8_FEED" >> feeds.conf.default
          # 展示最终的软件源列表，方便在日志里确认
          cat feeds.conf.default

      # ============ 第 7 步：下载"应用过滤"插件源码 ============
      # 原因：OpenAppFilter(应用过滤) 以独立仓库发布，
      #       按官方说明直接克隆到 package/ 目录即可参与编译
      - name: 下载应用过滤插件源码
        run: |
          cd openwrt
          git clone --depth 1 "$OPENAPPFILTER_URL" package/OpenAppFilter

      # ============ 第 8 步：应用固件定制（改 LAN IP / 语言 / 密码等）============
      # 目的：调用 scripts/customize.sh，在固件里写入"首次启动自动执行"的设置
      #       改 LAN IP、账号、密码、语言 只动 scripts/customize.sh 这一个文件
      - name: 应用固件定制
        run: |
          bash scripts/customize.sh openwrt
          # 把 customize.sh 输出的定制信息导入工作流环境变量，
          # 供后面发布页展示 LAN IP / 账号 / 密码 等
          source build_info.env
          echo "LAN_IP=$LAN_IP" >> "$GITHUB_ENV"
          echo "LAN_USER=$LAN_USER" >> "$GITHUB_ENV"
          echo "LAN_PASSWORD=$LAN_PASSWORD" >> "$GITHUB_ENV"
          echo "LANGUAGE=$LANGUAGE" >> "$GITHUB_ENV"
          echo "HOSTNAME=$HOSTNAME" >> "$GITHUB_ENV"

      # ============ 第 9 步：更新并安装软件源 ============
      # update   = 把各软件源的代码下载到 feeds/ 目录
      # install  = 在 OpenWrt 构建系统里注册这些软件包
      # 顺序很重要：必须先装好软件源，再应用 config，
      #            否则 make defconfig 不认识 config 里的包名，会把它们悄悄丢掉
      - name: 更新并安装软件源
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ============ 第 10 步：应用自定义配置 ============
      # 目的：把本仓库 config/x86_64.config 复制成 OpenWrt 的 .config
      - name: 应用自定义配置
        run: |
          cp -f "$CONFIG_FILE" openwrt/.config
          echo "已写入自定义配置: $CONFIG_FILE"

      # ============ 第 11 步：生成完整编译配置 ============
      # 原因：x86_64.config 里只写了我们关心的少数选项，
      #       make defconfig 会自动补全所有依赖项，生成一份完整可用的 .config
      # 注意：defconfig 会静默丢弃"不认识的配置行"(包名写错/源里没有该包/依赖
      #       不满足都会被直接删掉)，所以下一步必须校验，防止静默出错固件
      - name: 生成完整编译配置
        run: |
          cd openwrt
          make defconfig

      # ============ 第 12 步：上传最终配置文件(调试用) ============
      # 目的：把 defconfig 生成的完整 .config 存为构建产物。
      #       万一固件里缺插件，下载这个文件一查便知"配置层面"有没有装上
      - name: 上传最终配置文件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-final-config
          path: openwrt/.config

      # ============ 第 13 步：校验插件是否被正确启用 ============
      # 目的：逐个核对 config 里写的插件在最终 .config 中是否真的启用了。
      #       如果有丢失，立刻报错并列出原因提示，绝不静默编译出缺插件的固件
      - name: 校验插件是否被正确启用
        run: |
          cd openwrt
          # 从你的 config 种子里提取所有手动启用的包名(CONFIG_PACKAGE_xxx=y)
          WANTED=$(grep -oE '^CONFIG_PACKAGE_[A-Za-z0-9_-]+=y' "$GITHUB_WORKSPACE/$CONFIG_FILE" \
                   | sed -E 's/^CONFIG_PACKAGE_//; s/=y$//')
          MISSING=""
          for p in $WANTED; do
            # 在最终 .config 里找这个包是否真的处于启用状态
            grep -q "^CONFIG_PACKAGE_${p}=y" .config || MISSING="$MISSING $p"
          done
          if [ -n "$MISSING" ]; then
            echo "=================================================="
            echo "以下配置项被 make defconfig 丢弃了(固件里将不会有它们)："
            for p in $MISSING; do echo "  - $p"; done
            echo ""
            echo "常见原因："
            echo "  1) 包名写错(必须和源里完全一致，区分大小写和横线)"
            echo "  2) 该包不在当前任何软件源里(需要先添加对应源)"
            echo "  3) 该包依赖的东西不满足(比如依赖的内核模块没开)"
            echo ""
            echo "下面自动在软件源里搜索相近的包名，供参考："
            for p in $MISSING; do
              # 去掉 luci-app-/luci-theme- 前缀后搜索，能找到更多相近结果
              kw=$(echo "$p" | sed -E 's/^luci-(app|theme)-//')
              echo "--- 搜索: $kw ---"
              find feeds package -maxdepth 3 -type d -iname "*${kw}*" 2>/dev/null || echo "  (没有找到)"
            done
            echo "=================================================="
            exit 1
          fi
          echo "校验通过：config 里的所有插件均已正确启用"

      # ============ 第 14 步：提前下载全部源码包 ============
      # 原因：先统一下载再编译，遇到网络原因下载失败可以在这里快速重试，
      #       不会浪费已经编译好的部分
      - name: 预下载源码包
        run: |
          cd openwrt
          make download -j$(nproc)
          # 体积异常小(小于1KB)的文件说明下载不完整，直接删掉防止解压出错
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ============ 第 15 步：开始编译固件 ============
      # 先用全部 CPU 核心并行编译；万一失败则回退成单线程 + 详细日志，
      # 这样既快，又能在出错时从日志里看清具体是哪个包编译失败
      - name: 开始编译
        run: |
          cd openwrt
          echo "编译开始时间: $(date)"
          make -j$(nproc) || make -j1 V=s
          echo "编译结束时间: $(date)"

      # ============ 第 16 步：收集编译产物(只挑 IMG 镜像) ============
      # 原因：编译会生成很多文件，这里只把 .img.gz 镜像和校验文件挑出来发布
      - name: 收集固件文件
        run: |
          # 转到 X86_64 平台的编译产物目录
          cd openwrt/bin/targets/x86/64
          # 建一个干净的目录存放最终要发布的文件
          mkdir -p "$GITHUB_WORKSPACE/firmware"
          # 只复制 .img.gz 镜像（config 里已关掉 VMDK/VHDX 等格式，所以只有 IMG）
          cp -v *.img.gz "$GITHUB_WORKSPACE/firmware/"
          # 复制官方生成的 SHA256 校验文件，方便下载后核对完整性
          cp -v sha256sums "$GITHUB_WORKSPACE/firmware/" || true

          # ---- 下面收集"发布页"要展示的信息 ----
          # 发布标签用"日期+时间"，保证每次构建的 Release 不会互相冲突
          echo "TAG_NAME=OpenWrt-x86_64-$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=OpenWrt X86_64 固件 $(date +'%Y年%m月%d日 %H:%M')" >> "$GITHUB_ENV"
          # 源码版本：lede 最新提交的 日期-短哈希（如 20260905-a1b2c3d）
          echo "SOURCE_VER=$(git -C "$GITHUB_WORKSPACE/openwrt" log -1 --format='%cd-%h' --date=format:'%Y%m%d')" >> "$GITHUB_ENV"
          # 内核版本：从最终 .config 里提取 CONFIG_LINUX_x_y（如 6.12）
          KERNEL_VER=$(grep -E '^CONFIG_LINUX_[0-9]+_[0-9]+=y' "$GITHUB_WORKSPACE/openwrt/.config" \
                      | head -n1 | sed -E 's/^CONFIG_LINUX_//; s/=y$//; s/_/./')
          # 提取失败时给出兜底值，避免发布页出现空白
          [ -n "$KERNEL_VER" ] || KERNEL_VER=未知
          echo "KERNEL_VER=$KERNEL_VER" >> "$GITHUB_ENV"
          # 插件清单：从最终 .config 里筛出所有已启用的插件，一行一个
          PLUGINS=$(grep -E '^CONFIG_PACKAGE_(luci-app-[a-z0-9_-]+|luci-theme-[a-z0-9_-]+|ddnsto|adguardhome|AdGuardHome|smartdns|open-app-filter|oaf|luci-ssl)=y' \
                    "$GITHUB_WORKSPACE/openwrt/.config" \
                    | sed -E 's/^CONFIG_PACKAGE_//; s/=y$//' | sort -u)
          echo "$PLUGINS" > "$GITHUB_WORKSPACE/firmware/plugins.txt"
          # 在日志里展示产物清单，方便直接确认
          ls -lh "$GITHUB_WORKSPACE/firmware/"

      # ============ 第 15 步：生成发布说明 ============
      # 包含：固件版本、内核版本、LAN IP、账号密码、插件清单(一行一个)
      - name: 生成发布说明
        run: |
          cat > release.txt <<EOF
          ============================================
           OpenWrt (lede) X86_64 固件信息
          ============================================

          【固件版本】
          $SOURCE_VER（lede master 快照）

          【内核版本】
          Linux $KERNEL_VER

          【默认 LAN IP】
          $LAN_IP

          【登录账号】
          $LAN_USER

          【登录密码】
          $LAN_PASSWORD（首次登录后请立即修改）

          【已集成插件】（一行一个）
          $(cat firmware/plugins.txt)

          【镜像文件说明】
          - combined-efi.img.gz : UEFI 启动用（新电脑/新虚拟机首选）
          - combined.img.gz     : BIOS 传统启动用
          - squashfs / ext4     : squashfs 支持一键恢复出厂，推荐使用
          - .img.gz 下载后解压一次得到 .img 再刷入
          ============================================
          EOF

      # ============ 第 18 步：发布 Release ============
      # 把固件上传到仓库 Releases 页面，任何人都可以直接下载
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}      # Release 标签(每次构建唯一)
          name: ${{ env.RELEASE_NAME }}      # Release 标题
          body_path: release.txt             # 上一步生成的发布说明
          files: |
            firmware/*.img.gz
            firmware/sha256sums
