# ================================================================
# 临时诊断工作流（分析完毕后删除）
#
# 目的：查清 make defconfig 为何把 config/X86_64.config 里声明的插件
#       静默丢弃（run #72：23 个包被置 n，且 defconfig 无任何报错）。
#
# 首轮结论（已完成）：
#   · 仅使用 ImmortalWrt 官方 feeds 时，luci feed 的插件全部保留，
#     只有 13 个第三方插件因"未定义"而缺失（符合预期）。
#   · 因此嫌疑落在「第三方插件注入」这一环节。
#
# 本轮做三阶段隔离，逐项引入变量，定位到具体是哪一步把 LuCI 应用
# 整片拖下水：
#   阶段 A：纯官方 feeds                        （基线，已知结果）
#   阶段 B：A + files/ + scripts/ 注入（不拉第三方）
#   阶段 C：B + feeds_update.sh 拉第三方 + patch-plugins.sh
# ================================================================
name: DIAG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gawk gettext git \
            libncurses-dev libssl-dev zlib1g-dev python3 python3-setuptools \
            rsync unzip file wget curl patch time

      - name: 克隆源码
        run: |
          git clone --depth 1 --single-branch --branch openwrt-24.10 \
            https://github.com/immortalwrt/immortalwrt src
          cd src && git log -1 --format='%h %cd' --date=short

      - name: 更新 feeds
        run: |
          cd src
          ./scripts/feeds update -a 2>&1 | tail -10
          ./scripts/feeds install -a 2>&1 | tail -3

      - name: 阶段B - 注入 files/ 与 scripts/（不拉第三方）
        run: |
          cd src
          mkdir -p files
          cp -a ../files/. files/
          cp -f ../scripts/*.sh scripts/
          chmod 0755 scripts/*.sh
          cp ../config/X86_64.config .config
          make defconfig > ../B_defconfig.out 2>&1 || echo "rc=$?"
          cp .config ../B_result.config
          cp tmp/.config-package.in ../B_pkg.in
          echo "=== 阶段B defconfig 输出 ==="; cat ../B_defconfig.out

      - name: 阶段C - 再拉第三方插件并打补丁
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src
          bash scripts/system-config.sh . 2>&1 | tail -5
          bash scripts/feeds_update.sh > ../C_feeds.log 2>&1 || echo "feeds_update rc=$?"
          tail -25 ../C_feeds.log
          echo "=== package/thirdparty 内容 ==="
          ls -1 package/thirdparty 2>/dev/null || echo "（空）"
          GITHUB_TOKEN="${GITHUB_TOKEN}" bash scripts/patch-plugins.sh . > ../C_patch.log 2>&1 || echo "patch rc=$?"
          tail -20 ../C_patch.log
          rm -rf tmp/.config-package.in tmp/.packageinfo
          cp ../config/X86_64.config .config
          make defconfig > ../C_defconfig.out 2>&1 || echo "rc=$?"
          cp .config ../C_result.config
          cp tmp/.config-package.in ../C_pkg.in
          echo "=== 阶段C defconfig 输出 ==="; cat ../C_defconfig.out

      - name: 分析三阶段差异
        run: |
          set +e
          WS="$GITHUB_WORKSPACE"
          WANT=$(grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$' "$WS/config/X86_64.config" | sed 's/^CONFIG_//;s/=y$//')

          for phase in B C; do
            echo ""
            echo "################################################################"
            echo "##  阶段 $phase ：声明为 =y 但最终不是 =y 的符号"
            echo "################################################################"
            for sym in $WANT; do
              if ! grep -qxF "CONFIG_$sym=y" "$WS/${phase}_result.config"; then
                if grep -qE "^# ?CONFIG_${sym} is not set" "$WS/${phase}_result.config"; then
                  echo "  [丢] $sym   （符号存在但被置 n → 依赖被判定不成立）"
                else
                  echo "  [缺] $sym   （符号不存在 → 该包未进入元数据）"
                fi
              fi
            done
          done

          echo ""
          echo "################################################################"
          echo "##  阶段C：tmp/.config-package.in 中被丢符号的完整 config 块"
          echo "##          （含缩进层级，用于判断是否被外层 if 包裹）"
          echo "################################################################"
          for sym in luci-app-mwan3 luci-theme-argon luci-app-openclash \
                     luci-app-smartdns luci-app-nlbwmon luci-app-argon-config; do
            [ -f "$WS/C_pkg.in" ] || break
            echo "========== $sym =========="
            ln=$(grep -nE "^[[:space:]]*config PACKAGE_${sym}\$" "$WS/C_pkg.in" | head -1 | cut -d: -f1)
            if [ -z "$ln" ]; then echo "      （符号不存在于 C_pkg.in）"; continue; fi
            echo "      [定义行号] $ln   缩进级别=$(sed -n "${ln}p" "$WS/C_pkg.in" | sed 's/[^	]//g' | wc -c)"
            echo "      --- 往上 25 行，看外层嵌套条件 ---"
            sed -n "$((ln > 25 ? ln - 25 : 1)),${ln}p" "$WS/C_pkg.in" | nl -ba | sed 's/^/      /'
            echo "      --- 该 config 块内容 ---"
            sed -n "${ln},$((ln + 18))p" "$WS/C_pkg.in" | sed 's/^/      /'
          done

          echo ""
          echo "=== 阶段C defconfig WARNING/error ==="
          grep -iE "warning|error" "$WS/C_defconfig.out" | head -40
          echo "=== 阶段C 相对阶段B 的 meta 差异 ==="
          echo "B_pkg.in 行数: $(wc -l < "$WS/B_pkg.in")"
          echo "C_pkg.in 行数: $(wc -l < "$WS/C_pkg.in")"

      - name: 上传诊断产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag2-${{ github.run_number }}
          path: |
            B_result.config
            B_defconfig.out
            C_result.config
            C_defconfig.out
            C_feeds.log
            C_patch.log
            B_pkg.in
            C_pkg.in
          if-no-files-found: warn
          retention-days: 7
