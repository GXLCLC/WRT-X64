name: Build iStoreOS 24.10 for X86_64

# 触发条件：手动触发、推送至 main 分支、定时编译
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * 5'  # 每周五 16:00 UTC 自动编译

env:
  REPO_URL: https://github.com/istoreos/istoreos.git
  REPO_BRANCH: istoreos-24.10   # 明确拉取 24.10 分支源码
  CONFIG_FILE: config/x86_64.config
  TZ: Asia/Shanghai

jobs:
  build:
    # 明确指定使用 Ubuntu 22.04，避免 latest 升级到 24.04 导致软件包缺失
    runs-on: ubuntu-22.04

    steps:
      # ===== 1. 检出当前仓库代码 =====
      - name: Checkout
        uses: actions/checkout@v4

      # ===== 2. 初始化编译环境，安装依赖工具 =====
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 释放磁盘空间，移除无用的大型文件
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          # 更新软件源列表
          sudo -E apt-get -qq update
          # 安装编译所需依赖（已适配 Ubuntu 22.04）
          # 注意：已移除 python2.7，用 genisoimage 替换 mkisofs
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libc6-dev-mips32 \
            libelf-dev libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool lrzsz genisoimage msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
            xmlto xxd zlib1g-dev
          # 清理无用依赖，释放磁盘空间
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      # ===== 3. 克隆 iStoreOS 24.10 源码 =====
      - name: Clone iStoreOS Source
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "REPO_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV

      # ===== 4. 加载自定义编译配置文件 =====
      - name: Load Custom Config
        run: |
          cp $CONFIG_FILE openwrt/.config

      # ===== 5. 执行 diy-part1 脚本（添加第三方源、克隆插件） =====
      - name: Run DIY Scripts (Part 1)
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/diy-part1.sh
          cd openwrt
          $GITHUB_WORKSPACE/scripts/diy-part1.sh

      # ===== 6. 拉取独立的系统配置修改脚本 =====
      - name: Fetch System Config Script
        run: |
          cd openwrt
          curl -fsSL -o $GITHUB_WORKSPACE/scripts/system-config.sh \
            https://raw.githubusercontent.com/YOUR_USERNAME/istoreos-config-script/main/system-config.sh
          chmod +x $GITHUB_WORKSPACE/scripts/system-config.sh

      # ===== 7. 更新并安装 feeds 软件包源 =====
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ===== 8. 生成最终配置并强制设定 Argon 主题 =====
      - name: Configure Firmware
        run: |
          cd openwrt
          make defconfig
          # 将 Argon 设为默认主题
          sed -i 's/CONFIG_PACKAGE_luci-theme-bootstrap=y/# CONFIG_PACKAGE_luci-theme-bootstrap is not set/' .config
          sed -i 's/# CONFIG_PACKAGE_luci-theme-argon is not set/CONFIG_PACKAGE_luci-theme-argon=y/' .config
          make defconfig

      # ===== 9. 预下载编译所需的软件包源码 =====
      - name: Download Package Sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ===== 10. 注入系统配置修改脚本（随固件编译） =====
      - name: Apply System Config Customization
        run: |
          cd openwrt
          # 将独立脚本复制到源码树中，在首次启动时自动执行
          cp $GITHUB_WORKSPACE/scripts/system-config.sh package/base-files/files/etc/uci-defaults/99-custom-config.sh
          chmod +x package/base-files/files/etc/uci-defaults/99-custom-config.sh

      # ===== 11. 编译固件（多线程，失败时降级单线程输出详细日志） =====
      - name: Compile Firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      # ===== 12. 执行 diy-part2 脚本（编译后处理） =====
      - name: Run DIY Scripts (Part 2)
        if: steps.compile.outputs.status == 'success'
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/diy-part2.sh
          cd openwrt
          $GITHUB_WORKSPACE/scripts/diy-part2.sh

      # ===== 13. 整理固件文件，仅保留 IMG 格式 =====
      - name: Organize Firmware Files
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/x86/64
          mkdir -p $GITHUB_WORKSPACE/firmware
          # 仅复制 img.gz 文件，不生成 VHDX/VMDK
          cp -v *.img.gz $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
        