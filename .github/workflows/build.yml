# ==============================================================================
# OpenWrt 云编译主工作流
# 仅负责流水线调度：环境准备 -> 拉取 LEDE 源码 -> 调用各独立脚本 -> 编译 -> 打包 -> 发布 Release
# 注意：本文件禁止硬编码插件源、系统参数，所有配置逻辑均已剥离到 scripts/ 下独立脚本
# ==============================================================================
name: OpenWrt 云编译

# 触发条件：支持手动触发，也支持修改配置/脚本后自动触发
on:
  # 手动触发，可在 Actions 页面输入自定义 Release 标签
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布标签（留空则使用编译日期自动生成）'
        required: false
        default: ''
  # 推送代码到 main 分支时触发（仅当配置、脚本或工作流本身改动时）
  push:
    branches:
      - main
    paths:
      - 'config/.config'
      - 'scripts/**'
      - '.github/workflows/build.yml'

# 工作流全局环境变量（仅声明通用调度参数，不包含插件源与系统参数）
env:
  # LEDE 源码仓库地址
  OPENWRT_REPO: https://github.com/coolsnowwolf/lede
  # LEDE 源码分支
  OPENWRT_BRANCH: master
  # 编译目标平台（X86_64 架构）
  TARGET_PLATFORM: x86
  TARGET_SUBTARGET: '64'
  # 编译线程数（根据 GitHub Runner 性能调整，过大易导致 OOM）
  COMPILE_THREAD: '2'
  # LEDE 源码本地目录名
  OPENWRT_DIR: openwrt

# 并发控制：同一仓库同一分支同时只允许一个编译任务运行
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 任务名称
    name: 编译 X86_64 固件
    # 运行环境：Ubuntu 22.04
    runs-on: ubuntu-22.04
    # 任务超时时间（分钟），避免异常卡死占用资源
    timeout-minutes: 240

    steps:
      # --------------------------------------------------------------------------
      # 步骤 1：检出本仓库代码（包含 .config、scripts/、docs/ 等配置文件）
      # --------------------------------------------------------------------------
      - name: 检出本仓库代码
        uses: actions/checkout@v4

      # --------------------------------------------------------------------------
      # 步骤 2：扩容 Runner 磁盘空间
      # 规避 GitHub 默认磁盘空间不足导致编译失败问题
      # 通过删除预装的大型工具链（.NET、Android SDK、Haskell 等）释放空间
      # --------------------------------------------------------------------------
      - name: 扩容 Runner 磁盘空间
        run: |
          set -e
          echo ">>> 清理 Runner 预装大型工具链以释放磁盘空间"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/lib/llvm /usr/local/share/boost \
                      /usr/local/share/chrom* /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get autoremove -y 2>/dev/null || true
          # 移除可能存在的 Docker 镜像
          sudo docker image prune -af 2>/dev/null || true
          echo ">>> 当前磁盘可用空间："
          df -h

      # --------------------------------------------------------------------------
      # 步骤 3：初始化编译环境（安装 OpenWrt 编译所需依赖）
      # --------------------------------------------------------------------------
      - name: 初始化编译环境
        run: |
          set -e
          echo ">>> 更新 apt 源并安装编译依赖"
          sudo apt-get update
          sudo apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext \
              git libncurses5-dev libz-dev patch python3 python2.7 unzip zlib1g-dev \
              lib32gcc-s1 libc6-dev-i386 rsync wget curl subversion ecj fastjar \
              jar java-common sharutils
          # openssl 用于生成登录密码加密串
          sudo apt-get -y install openssl || true
          echo ">>> 编译环境准备完成"
          df -h

      # --------------------------------------------------------------------------
      # 步骤 4：配置 actions/cache 缓存源码与 feeds
      # 缓存 dl/（下载源码包）与 feeds/ 目录，减少重复编译耗时
      # 缓存键基于 .config 与 feeds_manage.sh 内容，配置变动时自动刷新缓存
      # --------------------------------------------------------------------------
      - name: 缓存 OpenWrt 源码与 Feeds
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.OPENWRT_DIR }}/dl
            ${{ env.OPENWRT_DIR }}/feeds
          key: openwrt-cache-${{ hashFiles('config/.config', 'scripts/feeds_manage.sh') }}
          restore-keys: |
            openwrt-cache-

      # --------------------------------------------------------------------------
      # 步骤 5：拉取 LEDE 最新源码
      # 若缓存未命中则全新克隆；若缓存命中则更新到最新提交
      # --------------------------------------------------------------------------
      - name: 拉取 LEDE 源码
        run: |
          set -e
          if [ -d "${OPENWRT_DIR}/.git" ]; then
            echo ">>> 使用已有缓存源码，更新到最新提交"
            cd "${OPENWRT_DIR}"
            git fetch --all --tags
            git reset --hard origin/${OPENWRT_BRANCH}
            git pull --ff-only origin ${OPENWRT_BRANCH} 2>/dev/null || true
          else
            echo ">>> 全新克隆 LEDE 源码（浅克隆以节省时间）"
            git clone --depth 1 --single-branch --branch ${OPENWRT_BRANCH} ${OPENWRT_REPO} ${OPENWRT_DIR}
            cd "${OPENWRT_DIR}"
          fi
          # 记录当前 LEDE commit 信息，供 Release 信息使用
          git log -1 --pretty=format:'commit: %H%n日期: %ci%n说明: %s' > LEDE_COMMIT_INFO.txt
          echo ">>> LEDE 源码信息："
          cat LEDE_COMMIT_INFO.txt

      # --------------------------------------------------------------------------
      # 步骤 6：拷贝本仓库的 .config 编译配置到 LEDE 源码根目录
      # 使用者可在 config/.config 中勾选增减插件
      # --------------------------------------------------------------------------
      - name: 应用编译配置文件
        run: |
          set -e
          echo ">>> 拷贝 config/.config 到 LEDE 源码根目录"
          cp -f config/.config "${OPENWRT_DIR}/.config"
          echo ">>> 配置文件已就绪"

      # --------------------------------------------------------------------------
      # 步骤 7：调用独立脚本管理第三方插件源（feeds_manage.sh）
      # 完成插件源拉取、稀疏克隆、feeds update && feeds install
      # 工作目录为 LEDE 源码根目录，便于脚本操作 feeds.conf 等文件
      # --------------------------------------------------------------------------
      - name: 管理第三方插件源（feeds_manage.sh）
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -e
          bash "${GITHUB_WORKSPACE}/scripts/feeds_manage.sh"

      # --------------------------------------------------------------------------
      # 步骤 8：调用独立脚本修改系统基础参数（system_config.sh）
      # 修改 LAN IP、主机名、后台登录用户名、密码等
      # 工作目录为 LEDE 源码根目录，脚本会修改 base-files 中的对应配置
      # --------------------------------------------------------------------------
      - name: 修改系统基础参数（system_config.sh）
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -e
          bash "${GITHUB_WORKSPACE}/scripts/system_config.sh"

      # --------------------------------------------------------------------------
      # 步骤 9：生成 defconfig 并预下载依赖源码
      # make defconfig 自动补全 .config 缺失项；make download 提前下载，
      # 避免编译过程中因下载中断导致编译失败
      # --------------------------------------------------------------------------
      - name: 生成 defconfig 并预下载依赖
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -e
          # 启用 pipefail：管道中任一命令失败即视为整条命令失败
          set -o pipefail
          echo ">>> 生成 defconfig"
          make defconfig
          echo ">>> 预下载依赖源码（-j 控制并发）"
          # 下载失败立即终止工作流（pipefail 捕获 make 失败状态）
          make download -j${COMPILE_THREAD} V=s 2>&1 | tail -50
          echo ">>> 依赖预下载完成"

      # --------------------------------------------------------------------------
      # 步骤 10：编译固件
      # 编译出现任何错误立即终止工作流（set -e + make 失败即退出）
      # --------------------------------------------------------------------------
      - name: 编译固件
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          set -e
          # 启用 pipefail：管道中任一命令失败即视为整条命令失败
          # 确保编译失败时工作流立即终止（make 失败 -> pipefail -> set -e 退出）
          set -o pipefail
          echo ">>> 开始编译 X86_64 固件（线程数 ${COMPILE_THREAD}）"
          # 输出详细日志并保存到 build.log，便于失败时排查
          make -j${COMPILE_THREAD} V=s 2>&1 | tee build.log
          # 校验关键产物是否存在：squashfs combined IMG 镜像
          echo ">>> 校验编译产物"
          if ! find bin/targets/${TARGET_PLATFORM}/${TARGET_SUBTARGET} -name "*combined*.img*" | grep -q .; then
            echo ">>> 错误：未找到 squashfs combined IMG 镜像产物，编译失败"
            exit 1
          fi
          echo ">>> 编译成功，产物列表："
          find bin/targets/${TARGET_PLATFORM}/${TARGET_SUBTARGET} -name "*.img*" -exec ls -lh {} \;

      # --------------------------------------------------------------------------
      # 步骤 11：调用脚本生成 Release markdown 正文
      # 自动读取 system_config.sh 内配置、内核版本、插件清单等
      # --------------------------------------------------------------------------
      - name: 生成 Release 信息（gen_release_info.sh）
        run: |
          set -e
          bash scripts/gen_release_info.sh > release_body.md
          echo ">>> Release 正文预览："
          cat release_body.md

      # --------------------------------------------------------------------------
      # 步骤 12：收集 IMG 镜像文件
      # 仅收集 IMG 镜像，不包含 VHDX、VMDK 等其他格式镜像
      # --------------------------------------------------------------------------
      - name: 收集 IMG 镜像文件
        run: |
          set -e
          mkdir -p artifacts
          echo ">>> 收集 IMG 镜像（排除 VHDX/VMDK/QEMU 格式）"
          find "${OPENWRT_DIR}/bin/targets/${TARGET_PLATFORM}/${TARGET_SUBTARGET}" \
              -name "*.img*" \
              ! -name "*.vmdk*" \
              ! -name "*.vhdx*" \
              ! -name "*.qcow*" \
              -exec cp -f {} artifacts/ \;
          echo ">>> 待发布的镜像文件："
          ls -lh artifacts/

      # --------------------------------------------------------------------------
      # 步骤 13：发布 Release（自动在 GitHub 创建 Release 发布固件镜像）
      # Release 正文自动填充 LAN IP、账号密码、内核版本、固件版本、插件清单
      # --------------------------------------------------------------------------
      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || format('OpenWrt-X86_64-{0}', github.run_number) }}
          name: OpenWrt X86_64 固件 #${{ github.run_number }}
          body_path: release_body.md
          files: artifacts/*
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------------------------
      # 步骤 14（可选）：编译失败时上传编译日志，便于排查
      # --------------------------------------------------------------------------
      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ${{ env.OPENWRT_DIR }}/build.log
            ${{ env.OPENWRT_DIR }}/LEDE_COMMIT_INFO.txt
          retention-days: 7
