# ==============================================================
# ImmortalWrt x86_64 固件云编译工作流（P3TERX 风格）
# 功能：自动拉取 master 分支最新源码 → 补齐缺失第三方插件
#       → 全自动编译 squashfs combined IMG 镜像 → 自动发布 Release
# ==============================================================
name: Build ImmortalWrt x86_64

on:
  # 支持在 Actions 页面手动触发
  workflow_dispatch:
  # 配置文件或脚本变更时自动触发（如不需要可删除此段）
  push:
    branches:
      - main          # 按你的仓库默认分支修改
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/**"

env:
  # ImmortalWrt 源码仓库与分支（master = 最新内核与软件包）
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  # 仓库内置的固件配置文件路径
  CONFIG_FILE: config/x86-64.config
  TZ: Asia/Shanghai

# 同一时间仅保留一个构建任务，自动取消旧的重复任务，节约资源
concurrency:
  group: build-x86_64
  cancel-in-progress: true

jobs:
  build:
    # 用户指定的编译环境：Ubuntu 22.04
    runs-on: ubuntu-22.04
    permissions:
      # 授权工作流创建 Release（自动发布固件必需）
      contents: write

    steps:
      # ----------------------------------------------------------
      # 步骤 1：检出本仓库，获取 .config 与三个功能脚本
      # ----------------------------------------------------------
      - name: 检出仓库文件
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 步骤 2：初始化编译环境
      #   a. 清理 runner 预装的无用软件，释放磁盘空间（编译约需 25G+）
      #   b. 安装 ImmortalWrt 官方要求的全量编译依赖
      #   c. 创建 8G 交换分区，防止链接阶段内存不足导致 OOM
      # ----------------------------------------------------------
      - name: 初始化编译环境（清理磁盘 + 安装依赖 + 创建 swap）
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 删除与编译无关的预装组件（.NET / Android SDK / CodeQL 等）
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/codeql
          # 卸载大体积预装软件，进一步释放磁盘
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* snapd* || true
          # 更新软件源索引
          sudo -E apt-get -qq update
          # 一次性安装官方文档要求的全部编译依赖，避免编译中途缺工具
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            ccache cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool \
            libyaml-dev libz-dev lld llvm mkisofs msmtp nano ninja-build p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-setuptools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          # 设置时区，保证后续 Release 时间戳正确
          sudo timedatectl set-timezone "$TZ"
          # 创建 8G swap（物理内存仅 7G，内核与大插件链接阶段易 OOM）
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          # 打印磁盘 / 内存概况，便于排查环境问题
          echo "===== 磁盘空间 ====="; df -hT / /mnt
          echo "===== 内存与 swap ====="; free -h

      # ----------------------------------------------------------
      # 步骤 3：浅克隆 ImmortalWrt 源码（master 分支，最新内核）
      # ----------------------------------------------------------
      - name: 克隆 ImmortalWrt 源码（master 分支）
        run: |
          # --depth 1 仅拉取最新一次提交，大幅缩短克隆时间
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" immortalwrt
          # 记录当前源码 commit，便于固件溯源
          git -C immortalwrt log -1 --format="本次编译源码: %H %ci"

      # ----------------------------------------------------------
      # 步骤 4：更新并安装 feeds（ImmortalWrt 官方软件源）
      #   update：拉取 packages / luci 等外部软件源
      #   install：将 feeds 中的软件包链接进编译树
      # ----------------------------------------------------------
      - name: 更新并安装官方 feeds 软件源
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ----------------------------------------------------------
      # 步骤 5：拉取缺失的第三方插件
      #   规则：优先使用 ImmortalWrt 自带软件包；
      #         仅当源码/feeds 中不存在时，才从第三方仓库
      #         稀疏检出（sparse checkout）所需子目录，不整仓克隆
      # ----------------------------------------------------------
      - name: 拉取缺失的第三方插件（SmartDNS / OpenClash / DDNSTO / EasyTier 等）
        run: |
          cd immortalwrt
          bash "$GITHUB_WORKSPACE/scripts/prepare-packages.sh"

      # ----------------------------------------------------------
      # 步骤 6：应用系统配置脚本
      #   读取 scripts/modify_system_config.sh 中定义的
      #   LAN IP / 登录密码 / 主机名 / 默认主题，
      #   生成首次开机自动生效的 uci-defaults 配置
      # ----------------------------------------------------------
      - name: 写入系统配置（LAN IP / 密码 / 主机名 / Argon 默认主题）
        run: |
          cd immortalwrt
          bash "$GITHUB_WORKSPACE/scripts/modify_system_config.sh"

      # ----------------------------------------------------------
      # 步骤 7：载入 .config 并自动补全依赖
      #   defconfig 自动解析依赖项；不存在的包会被自动剔除
      #   （不会中断编译），日志中可看到被忽略的选项
      # ----------------------------------------------------------
      - name: 载入固件配置并补全依赖
        run: |
          cd immortalwrt
          # 将仓库内置配置复制为源码根目录 .config
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          # 自动补全依赖；缺失软件包自动剔除，保证编译不中断
          make defconfig

      # ----------------------------------------------------------
      # 步骤 8：恢复 dl 缓存（复用上次构建下载的源码包，加速重复编译）
      # ----------------------------------------------------------
      - name: 恢复 dl 源码包缓存
        uses: actions/cache@v4
        with:
          path: immortalwrt/dl
          key: immortalwrt-x86_64-dl-${{ github.run_id }}
          restore-keys: |
            immortalwrt-x86_64-dl-

      # ----------------------------------------------------------
      # 步骤 9：下载全部软件源码包（dl 目录）
      # ----------------------------------------------------------
      - name: 下载编译所需源码包
        run: |
          cd immortalwrt
          # 8 线程并行下载所有源码压缩包
          make download -j8
          # 清理下载不完整的文件（小于 1KB 视为损坏，删除避免编译报错）
          find dl -size -1024c -exec rm -f {} \;

      # ----------------------------------------------------------
      # 步骤 10：编译固件（全程无交互）
      #   多线程全速编译；若失败自动降级为单线程重跑，
      #   并输出详细日志（V=s）便于定位报错位置
      # ----------------------------------------------------------
      - name: 编译固件（失败自动单线程重试）
        run: |
          cd immortalwrt
          echo "使用 $(nproc) 线程开始编译，预计 2~4 小时..."
          # 多线程编译；失败时单线程重跑并输出详细过程
          make -j$(nproc) || make -j1 V=s
          echo "===== 编译完成，产物列表 ====="
          ls -lh bin/targets/x86/64/

      # ----------------------------------------------------------
      # 步骤 11：生成 Release 发布信息
      #   复制 squashfs combined 镜像 → 计算 SHA256 →
      #   汇总固件版本 / 内核版本 / 登录信息 / 插件清单
      # ----------------------------------------------------------
      - name: 整理产物并生成 Release 说明
        run: |
          bash "$GITHUB_WORKSPACE/scripts/generate-release-info.sh" \
            "$GITHUB_WORKSPACE/immortalwrt" \
            "$GITHUB_WORKSPACE/release"

      # ----------------------------------------------------------
      # 步骤 12：上传固件到 Artifacts（Release 之外的临时备份渠道）
      # ----------------------------------------------------------
      - name: 上传固件到 Artifacts（保留 7 天）
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86_64-firmware
          path: immortalwrt/bin/targets/x86/64/*squashfs-combined*.img.gz
          retention-days: 7

      # ----------------------------------------------------------
      # 步骤 13：创建 GitHub Release，自动发布固件镜像与说明
      # ----------------------------------------------------------
      - name: 创建 Release 发布固件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 标签名附加时间戳，避免多次构建 tag 冲突
          TAG="X86_64-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE"/release/*.img.gz \
            "$GITHUB_WORKSPACE"/release/sha256sums \
            --title "ImmortalWrt-x86_64-${TAG}" \
            --notes-file "$GITHUB_WORKSPACE/release/release_notes.md"
