name: Build iStoreOS 24.10 for X86_64

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 16 * * 5'

env:
  REPO_URL: https://github.com/istoreos/istoreos.git
  REPO_BRANCH: istoreos-24.10
  CONFIG_FILE: config/x86_64.config
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ===== 1. 检出当前仓库代码 =====
      - name: Checkout
        uses: actions/checkout@v4

      # ===== 2. 初始化编译环境 =====
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo dpkg --add-architecture i386
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache cmake cpio curl device-tree-compiler \
            fastjar flex gawk gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool lrzsz genisoimage msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
            python3-docutils qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
            xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

      # ===== 3. 克隆 iStoreOS 24.10 源码 =====
      - name: Clone iStoreOS Source
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "REPO_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # ===== 4. 加载自定义编译配置文件 =====
      - name: Load Custom Config
        run: |
          cp $CONFIG_FILE openwrt/.config

      # ===== 5. 执行 diy-part1 脚本 =====
      - name: Run DIY Scripts (Part 1)
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/diy-part1.sh
          cd openwrt
          $GITHUB_WORKSPACE/scripts/diy-part1.sh

      # ===== 6. 更新并安装 feeds 软件包源 =====
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ===== 7. 生成最终配置 =====
      - name: Configure Firmware
        run: |
          cd openwrt
          make defconfig
          sed -i 's/CONFIG_PACKAGE_luci-theme-bootstrap=y/# CONFIG_PACKAGE_luci-theme-bootstrap is not set/' .config
          sed -i 's/# CONFIG_PACKAGE_luci-theme-argon is not set/CONFIG_PACKAGE_luci-theme-argon=y/' .config
          make defconfig

      # ===== 8. 预下载编译所需的软件包源码 =====
      - name: Download Package Sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ===== 9. 注入本地系统配置修改脚本 =====
      - name: Apply System Config Customization
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/scripts/system-config.sh package/base-files/files/etc/uci-defaults/99-custom-config.sh
          chmod +x package/base-files/files/etc/uci-defaults/99-custom-config.sh

      # ===== 10. 编译固件 =====
      - name: Compile Firmware
        id: compile
        run: |
          cd openwrt
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      # ===== 11. 执行 diy-part2 脚本 =====
      - name: Run DIY Scripts (Part 2)
        if: steps.compile.outputs.status == 'success'
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/diy-part2.sh
          cd openwrt
          $GITHUB_WORKSPACE/scripts/diy-part2.sh

      # ===== 12. 整理固件文件（仅保留 IMG） =====
      - name: Organize Firmware Files
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/x86/64
          mkdir -p $GITHUB_WORKSPACE/firmware
          cp -v *.img.gz $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          cp -v *.manifest $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
          cp -v *.sha256sums $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true

      # ===== 13. 提取系统信息（已修复 make 命令报错问题） =====
      - name: Extract System Info
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          KERNEL_VER=$(grep '^kernel - ' bin/targets/x86/64/*.manifest 2>/dev/null | head -n 1 | awk '{print $3}' || echo "unknown")
          KERNEL_VER=$(echo "$KERNEL_VER" | tr -d '\r\n ')
          if [ -z "$KERNEL_VER" ]; then KERNEL_VER="unknown"; fi
          
          echo "KERNEL_VERSION=$KERNEL_VER" >> $GITHUB_ENV
          FIRMWARE_VER="24.10.2-$(date +%Y%m%d%H%M)"
          echo "FIRMWARE_VERSION=$FIRMWARE_VER" >> $GITHUB_ENV
          echo "Kernel: $KERNEL_VER, Firmware: $FIRMWARE_VER"

      # ===== 14. 生成插件清单（已修复环境变量写入） =====
      - name: Generate Plugin List
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          grep -E '^luci-app-|^luci-theme-|^smartdns|^adguardhome|^nlbwmon|^ttyd|^mwan3|^docker|^easytier|^samba4|^upnp' \
            bin/targets/x86/64/*.manifest 2>/dev/null | \
            grep -vE 'kmod-|^lib|^kernel|^base-files|^busybox' | \
            awk '{print "- " $1}' > $GITHUB_WORKSPACE/plugin-list.txt || true
          
          echo "PLUGIN_LIST<<EOF" >> $GITHUB_ENV
          cat $GITHUB_WORKSPACE/plugin-list.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "=== Plugin List ==="
          cat $GITHUB_WORKSPACE/plugin-list.txt

      # ===== 15. 上传固件到 Artifacts =====
      - name: Upload Firmware to Artifacts
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-x86_64-${{ env.REPO_COMMIT }}
          path: firmware/

      # ===== 16. 创建 Release 并发布固件 =====
      - name: Create Release and Upload Firmware
        if: steps.compile.outputs.status == 'success' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x86_64-${{ github.run_number }}
          name: "iStoreOS X86_64 ${{ env.FIRMWARE_VERSION }}"
          body: |
            # iStoreOS X86_64 固件

            ## 固件信息
            - **LAN IP**: `192.168.2.1`
            - **后台登录**: `root` / `asdfghjkL666666`
            - **内核版本**: `${{ env.KERNEL_VERSION }}`
            - **固件版本**: `${{ env.FIRMWARE_VERSION }}`
            - **源码分支**: `${{ env.REPO_BRANCH }}`

            ## 已安装插件

            ${{ env.PLUGIN_LIST }}

            ## 刷写说明
            1. 解压 `*.img.gz` 文件
            2. 使用写盘工具（如 balenaEtcher、DiskImage）写入 U 盘或硬盘
            3. 从目标设备启动，通过 `http://192.168.2.1` 访问后台

            ---
            *由 GitHub Actions 自动构建*
          files: firmware/*
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_LIST: ${{ env.PLUGIN_LIST }}

      # ===== 17. 清理旧记录 =====
      - name: Cleanup Old Workflow Runs
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3