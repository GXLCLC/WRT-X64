# ============================================================================
# ImmortalWrt X86_64 云编译工作流（GitHub Actions）
# 流程：拉取源码 → 更新 feeds → 拉取第三方插件 → 应用系统配置 →
#       defconfig → 编译 → 整理 squashfs-combined IMG → 自动发布 Release
# ============================================================================
name: Build ImmortalWrt X86_64

on:
  workflow_dispatch:          # 支持在 Actions 页面手动触发编译
  push:                       # 推送到 main 分支时自动触发
    branches: [ main ]
#  schedule:                  # 如需定时编译，取消注释（UTC 时间，示例为北京时间每周五 02:00）
#    - cron: '0 18 * * 4'

# 全局环境变量：修改源码分支 / 脚本路径只需改这里，无需改动步骤
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt   # ImmortalWrt 官方源码仓库
  REPO_BRANCH: openwrt-24.10                             # 编译分支：openwrt-24.10
  CONFIG_FILE: .config                                   # 固件种子配置（支持使用者自行修改增减插件）
  DIY_P1_SH: scripts/diy-part1.sh                        # diy 脚本一：feeds 更新前的自定义处理
  DIY_P2_SH: scripts/diy-part2.sh                        # diy 脚本二：feeds 安装后拉取第三方插件
  SYSTEM_CONFIG_SH: scripts/system-config.sh             # 独立系统配置脚本：IP/密码/主机名/时区/主题
  RELEASE_INFO_SH: scripts/release-info.sh               # 独立 Release 信息生成脚本
  FIRMWARE_DIR: firmware                                 # 固件整理输出目录
  TZ: Asia/Shanghai                                      # 编译环境时区：Asia/Shanghai

# 自动创建 Release 需要仓库写入权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 检出本仓库，获取 .config 配置文件与四个独立维护的脚本
      - name: 1. 检出仓库文件
        uses: actions/checkout@v4

      # 2. 初始化编译环境：清理 Runner 无用组件释放磁盘，安装 ImmortalWrt 官方要求的全量编译依赖
      - name: 2. 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 清理 GitHub Runner 预装的无用组件（x86_64 编译约需 25GB+ 磁盘空间）
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          # 更新软件源并安装编译所需的全部依赖包
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            busybox cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git \
            gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm mkisofs msmtp nano ncurses-dev \
            nasm ninja-build p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxhash zlib1g-dev
          # 设置编译服务器时区为 Asia/Shanghai
          sudo timedatectl set-timezone "$TZ"
      # 2.5 脚本预检：四个 shell 脚本先做静态语法检查，提前暴露低级错误
      - name: 2.5 脚本语法预检
        run: |
          for f in "$GITHUB_WORKSPACE/$DIY_P1_SH" "$GITHUB_WORKSPACE/$DIY_P2_SH" \
                   "$GITHUB_WORKSPACE/$SYSTEM_CONFIG_SH" "$GITHUB_WORKSPACE/$RELEASE_INFO_SH"; do
            bash -n "$f" && echo "语法 OK: $f"
          done
      # 3. 浅克隆 ImmortalWrt 源码（openwrt-24.10 分支，--depth 1 节省时间）
      - name: 3. 克隆 ImmortalWrt 源码
        run: |
          df -hT "$PWD"
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" immortalwrt

      # 4. 执行 diy-part1 脚本：feeds 更新前的自定义处理（保留扩展位）
      - name: 4. 执行 diy-part1
        run: |
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          cd immortalwrt
          bash "$GITHUB_WORKSPACE/$DIY_P1_SH"

      # 5. 更新并安装官方 feeds 软件源（packages / luci / routing 等）
      - name: 5. 更新并安装 feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 6. 载入 .config 种子配置，并执行 diy-part2 按需浅克隆第三方插件
      - name: 6. 载入配置并拉取第三方插件
        run: |
          [ -e "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && cp "$GITHUB_WORKSPACE/$CONFIG_FILE" immortalwrt/.config
          chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
          cd immortalwrt
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      # 7. 执行独立系统配置脚本（LAN IP / 登录密码 / 主机名 / 时区 / 默认主题）
      #    后续只需维护 scripts/system-config.sh，无需改动本工作流
      - name: 7. 应用独立系统配置脚本
        run: |
          chmod +x "$GITHUB_WORKSPACE/$SYSTEM_CONFIG_SH"
          cd immortalwrt
          bash "$GITHUB_WORKSPACE/$SYSTEM_CONFIG_SH"

      # 8. make defconfig 展开完整配置，并校验关键插件是否全部被选中（缺失则警告，便于排错）
      - name: 8. 展开配置并校验插件
        run: |
          cd immortalwrt
          make defconfig
          for pkg in luci-theme-argon luci-app-argon-config smartdns luci-app-smartdns \
                     ddnsto luci-app-ddnsto adguardhome luci-app-adguardhome \
                     kmod-oaf luci-app-oaf luci-app-turboacc \
                     mwan3 luci-app-mwan3 nlbwmon luci-app-nlbwmon \
                     easytier luci-app-easytier luci-app-openclash; do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "::warning::关键软件包 ${pkg} 未被选中，请检查该包依赖或第三方仓库拉取是否成功"
            fi
          done

      # 9. 下载编译所需的 dl 依赖库，并清理下载不完整的损坏文件防止编译中断
      - name: 9. 下载编译依赖库
        run: |
          cd immortalwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # 10. 正式编译固件：先多线程并行；失败则自动切换单线程详细模式重试并记录排错日志
      - name: 10. 编译固件
        id: compile
        run: |
          cd immortalwrt
          echo "开始编译，并行线程数: $(nproc)"
          if make -j"$(nproc)"; then
            echo "编译成功"
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "并行编译失败，切换单线程详细模式重试并生成排错日志 build.log ..."
            make -j1 V=s 2>&1 | tee build.log
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # 11. 编译失败时上传失败日志 build.log 到 Artifacts，用于排查错误
      - name: 11. 上传编译失败日志
        if: failure() && steps.compile.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt_build_failed_log
          path: immortalwrt/build.log

      # 12. 整理固件输出：仅保留 squashfs 格式的 x86_64 combined IMG 镜像，并生成校验文件
      - name: 12. 整理固件输出
        if: steps.compile.outputs.status == 'success'
        run: |
          cd immortalwrt/bin/targets/x86/64
          mkdir -p "$GITHUB_WORKSPACE/$FIRMWARE_DIR"
          # 仅复制 squashfs-combined 的 IMG 镜像（含 BIOS 与 EFI 两种启动版本）
          cp -f ./*squashfs-combined*.img.gz "$GITHUB_WORKSPACE/$FIRMWARE_DIR/"
          # 删除 VMDK / VHDX / QCOW2 / VDI 等其他格式镜像与多余产物，确保仅输出 IMG
          rm -f ./*.vmdk* ./*.vhdx* ./*.qcow2* ./*.vdi* ./*.img ./*.img.gz
          # 生成 SHA256 校验文件，方便下载后校验完整性
          cd "$GITHUB_WORKSPACE/$FIRMWARE_DIR"
          sha256sum ./*.img.gz > sha256sums
          echo "最终固件输出："
          ls -lh

      # 13. 执行独立脚本生成 Release 发布信息（固件版本/内核/IP/账号密码/插件清单）
      - name: 13. 生成 Release 发布信息
        if: steps.compile.outputs.status == 'success'
        run: |
          chmod +x "$GITHUB_WORKSPACE/$RELEASE_INFO_SH"
          cd immortalwrt
          bash "$GITHUB_WORKSPACE/$RELEASE_INFO_SH" "$PWD" > "$GITHUB_WORKSPACE/release_body.md"
          # 按当前时间生成发布标签（Asia/Shanghai 时区）
          echo "RELEASE_TAG=$(TZ="$TZ" date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
          cat "$GITHUB_WORKSPACE/release_body.md"

      # 14. 上传固件到 Actions Artifacts（编译成功即固定保存一份，可随时下载）
      - name: 14. 上传固件到 Artifacts
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-X86_64-squashfs
          path: ${{ env.FIRMWARE_DIR }}/*

      # 15. 编译成功后自动创建 GitHub Release，发布固件镜像与说明信息
      - name: 15. 发布固件到 GitHub Releases
        if: steps.compile.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ImmortalWrt-X86_64_${{ env.RELEASE_TAG }}
          name: ImmortalWrt X86_64 固件 ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          files: |
            ${{ env.FIRMWARE_DIR }}/*.img.gz
            ${{ env.FIRMWARE_DIR }}/sha256sums
