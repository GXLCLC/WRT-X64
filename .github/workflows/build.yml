# ============================================================================
# ImmortalWrt 24.10 X86_64 云编译工作流（修正版）
# 修正要点：
#   1. 新增「关键包强校验」：defconfig 后逐一验证 DDNSTO / OAF 等关键包
#      是否仍为 =y，任何缺失直接终止，绝不再产出残缺固件
#   2. 默认 root 无密码（首次登录 LuCI 后再自行设置）
# ============================================================================
name: ImmortalWrt X86_64 云编译

# -------- 触发条件：手动运行 或 每周五定时自动编译 --------
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 5'    # 每周五 UTC 18:00（北京时间周六 02:00）

# -------- 全局环境变量 --------
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: config/x86_64.config
  FIRMWARE_DIR: firmware
  TZ: Asia/Shanghai
  # 关键包清单：defconfig 后逐一校验，缺一即失败（防止“配置写了但固件里没有”）
  REQUIRED_PKGS: >-
    ddnsto luci-app-ddnsto luci-app-oaf kmod-oaf
    smartdns luci-app-smartdns AdGuardHome luci-app-adguardhome
    luci-theme-argon luci-app-argon-config
    luci-app-openclash dnsmasq-full luci-app-turboacc
    luci-app-mwan3 luci-app-nlbwmon luci-app-easytier easytier

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04    # 若该 Runner 被下线可改为 ubuntu-latest
    steps:
      - name: 1. 检出本仓库
        uses: actions/checkout@v4

      - name: 2. 释放磁盘空间
        run: |
          sudo rm -rf /etc/apt/sources.list.d/ /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -hT

      - name: 3. 初始化编译环境
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm mkisofs msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils python3-setuptools \
            python3-setuptools-git qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          df -hT

      - name: 4. 拉取 ImmortalWrt 源码
        run: |
          git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git log -1 --format=%h)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=ImmortalWrt-24.10-X86_64-$(TZ=$TZ date +%Y.%m.%d-%H%M)" >> "$GITHUB_ENV"

      - name: 5. 更新 Feeds 软件源
        run: cd openwrt && ./scripts/feeds update -a

      - name: 6. 安装 Feeds 软件包
        run: cd openwrt && ./scripts/feeds install -a

      - name: 7. 拉取第三方插件（严格模式：失败立即终止）
        run: |
          chmod +x scripts/*.sh
          bash scripts/pull-packages.sh openwrt

      - name: 8. 载入固件配置并规范化
        run: |
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          make defconfig
          echo "===== 生效的插件与内核模块摘要 ====="
          grep -E '^CONFIG_PACKAGE_(luci|kmod|smartdns|easytier|ddnsto|AdGuardHome|mwan3|nlbwmon|dnsmasq)' .config || true

      # ★ 核心修正：关键包强校验 —— defconfig 后任何包被清理都会在此暴露并终止
      - name: 9. 关键包强校验（缺一即失败）
        run: |
          cd openwrt
          missing=""
          for pkg in $REQUIRED_PKGS; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
              echo "  ✔ $pkg"
            else
              echo "  ✘ $pkg（defconfig 后丢失：包未就位或依赖不满足）"
              missing="$missing $pkg"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::以下关键包未能生效，编译终止：$missing"
            echo "   排查方向：1) 第三方仓库分支/目录名 2) kmod 与内核版本兼容性 3) 依赖链是否完整"
            exit 1
          fi

      - name: 10. 注入系统个性化配置（root 无密码）
        run: bash scripts/system-config.sh openwrt

      - name: 11. 缓存 dl 依赖
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: immortalwrt-24.10-x86_64-dl-${{ github.sha }}
          restore-keys: immortalwrt-24.10-x86_64-dl-

      - name: 12. 下载软件包源码
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 13. 编译固件
        run: |
          set -o pipefail
          cd openwrt
          echo "编译线程数: $(nproc)"
          make -j$(nproc) 2>&1 | tee build.log || {
            echo "!! 多线程编译失败，切换单线程详细模式重试（用于定位错误）..."
            make -j1 V=s 2>&1 | tee build-debug.log
          }

      - name: 14. 输出错误日志摘要
        if: failure()
        run: |
          echo "===== 编译失败，错误日志尾部 ====="
          tail -n 80 openwrt/build-debug.log 2>/dev/null || \
            tail -n 80 openwrt/build.log 2>/dev/null || echo "未找到日志文件"

      - name: 15. 上传编译失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-failure-logs-${{ github.run_number }}
          path: |
            openwrt/build.log
            openwrt/build-debug.log
            openwrt/logs/
            openwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      - name: 16. 整理固件产物
        run: |
          cd openwrt
          echo "===== 关键包编译产物证据（ipk 清单） ====="
          find bin/packages -name '*.ipk' | grep -Ei 'ddnsto|oaf|smartdns|adguardhome|easytier|openclash|argon' || true
          echo "===== 编译产物列表 ====="
          ls -lh bin/targets/x86/64/ || { echo "!! 未找到固件产物"; exit 1; }
          mkdir -p ../"$FIRMWARE_DIR"
          # 仅保留 squashfs combined 镜像（EFI 与 BIOS 引导各一份）
          cp -v bin/targets/x86/64/*-squashfs-combined*.img.gz ../"$FIRMWARE_DIR"/
          cp -v bin/targets/x86/64/sha256sums ../"$FIRMWARE_DIR"/ 2>/dev/null || true
          cd ../"$FIRMWARE_DIR"
          for f in *.img.gz; do
            [ -e "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          echo "===== 最终发布文件 ====="
          ls -lh

      - name: 17. 生成 Release 发布说明
        run: |
          bash scripts/release-info.sh openwrt "$FIRMWARE_DIR"
          echo "===== 发布说明预览 ====="
          cat release-notes.md

      - name: 18. 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: ${{ env.FIRMWARE_DIR }}/
          retention-days: 30

      - name: 19. 发布固件到 GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            firmware/*.img.gz
            firmware/*.sha256