# ============================================================================
# ImmortalWrt 24.10 X86_64 云编译工作流
# 功能：拉取源码 -> 集成第三方插件 -> 编译 squashfs combined 镜像
#       -> 失败自动留存日志 -> 成功自动发布 GitHub Releases
# ============================================================================
name: ImmortalWrt X86_64 云编译

# ---------------- 触发条件：手动运行 或 每周五定时自动编译 ----------------
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 5'          # 每周五 UTC 18:00（北京时间周六 02:00）

# ---------------- 全局环境变量（更换源码分支在此调整）----------------
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-24.10
  CONFIG_FILE: config/x86_64.config
  FIRMWARE_DIR: firmware
  TZ: Asia/Shanghai

# 自动创建 Release 需要仓库内容写入权限（GITHUB_TOKEN 默认提供）
permissions:
  contents: write

jobs:
  build:
    # 编译环境：Ubuntu 22.04（若该 Runner 被官方下线，可改为 ubuntu-latest）
    runs-on: ubuntu-22.04

    steps:
      # ---------- 步骤 1：检出本仓库，获取 .config 配置与各独立脚本 ----------
      - name: 1. 检出本仓库
        uses: actions/checkout@v4

      # ---------- 步骤 2：释放磁盘空间（免费 Runner 可用磁盘有限，清理预装软件）----------
      - name: 2. 释放磁盘空间
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -hT

      # ---------- 步骤 3：安装编译依赖（ImmortalWrt 官方要求的完整工具链）----------
      - name: 3. 初始化编译环境
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm mkisofs msmtp nano ninja-build p7zip p7zip-full \
            patch pkgconf python3 python3-pip python3-ply python3-docutils python3-setuptools \
            python3-setuptools-git qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          df -hT

      # ---------- 步骤 4：浅克隆 ImmortalWrt 源码（openwrt-24.10 分支）----------
      - name: 4. 拉取 ImmortalWrt 源码
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt
          echo "SOURCE_COMMIT=$(git log -1 --format=%h)" >> $GITHUB_ENV
          echo "RELEASE_TAG=ImmortalWrt-24.10-X86_64-$(TZ=$TZ date +%Y.%m.%d-%H%M)" >> $GITHUB_ENV

      # ---------- 步骤 5：更新 Feeds 软件源（下载 ImmortalWrt 官方软件源索引）----------
      - name: 5. 更新 Feeds 软件源
        run: |
          cd openwrt
          ./scripts/feeds update -a

      # ---------- 步骤 6：安装 Feeds 软件包（自带插件由此进入编译系统）----------
      - name: 6. 安装 Feeds 软件包
        run: |
          cd openwrt
          ./scripts/feeds install -a

      # ---------- 步骤 7：拉取第三方插件（规则集中在 pull-packages.sh，独立维护）----------
      # 规则：优先源码自带；缺失部分按映射浅克隆（sparse，不拉取完整仓库）
      - name: 7. 拉取第三方插件
        run: |
          chmod +x scripts/*.sh
          bash scripts/pull-packages.sh openwrt

      # ---------- 步骤 8：载入 .config 并规范化（无效/冲突选项自动清理）----------
      # 使用者修改 config/x86_64.config 即可增减插件，无需改动工作流
      - name: 8. 载入固件配置
        run: |
          cp $CONFIG_FILE openwrt/.config
          cd openwrt
          make defconfig
          echo "===== 生效的插件与内核模块摘要 ====="
          grep -E '^CONFIG_PACKAGE_(luci|kmod|smartdns|easytier|ddnsto|AdGuardHome|mwan3|nlbwmon|dnsmasq)' .config || true

      # ---------- 步骤 9：注入系统个性化配置（LAN IP / 密码 / 主机名 / 主题）----------
      # 由 system-config.sh 独立维护，后续改配置无需改动本工作流
      - name: 9. 注入系统个性化配置
        run: |
          bash scripts/system-config.sh openwrt

      # ---------- 步骤 10：缓存 dl 依赖包（加速二次编译）----------
      - name: 10. 缓存 dl 依赖
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: immortalwrt-24.10-x86_64-dl-${{ github.sha }}
          restore-keys: |
            immortalwrt-24.10-x86_64-dl-

      # ---------- 步骤 11：预下载全部源码包（并清理损坏的小体积文件防中断）----------
      - name: 11. 下载软件包源码
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ---------- 步骤 12：编译固件（多线程；失败自动单线程 V=s 重试以暴露错误）----------
      - name: 12. 编译固件
        run: |
          set -o pipefail
          cd openwrt
          echo "编译线程数: $(nproc)"
          make -j$(nproc) 2>&1 | tee build.log || {
            echo "!! 多线程编译失败，切换单线程详细模式重试（用于定位错误）..."
            make -j1 V=s 2>&1 | tee build-debug.log
          }
          echo "===== 固件编译成功 ====="

      # ---------- 步骤 13：编译失败时在日志页输出错误尾部，快速定位问题 ----------
      - name: 13. 输出错误日志摘要
        if: failure()
        run: |
          echo "===== 编译失败，错误日志尾部 ====="
          tail -n 80 openwrt/build-debug.log 2>/dev/null || \
          tail -n 80 openwrt/build.log 2>/dev/null || echo "未找到日志文件"

      # ---------- 步骤 14：上传完整失败日志（logs 目录 + 编译输出，保留 7 天）----------
      - name: 14. 上传编译失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-failure-logs-${{ github.run_number }}
          path: |
            openwrt/build.log
            openwrt/build-debug.log
            openwrt/logs/**
            openwrt/.config
          if-no-files-found: ignore
          retention-days: 7

      # ---------- 步骤 15：整理固件产物（仅保留 squashfs combined 的 IMG 镜像）----------
      - name: 15. 整理固件产物
        run: |
          cd openwrt
          echo "===== 编译产物列表 ====="
          ls -lh bin/targets/x86/64/ || { echo "!! 未找到固件产物"; exit 1; }
          mkdir -p ../$FIRMWARE_DIR
          # 仅保留 squashfs combined 镜像（EFI 与 BIOS 引导各一份）
          cp -v bin/targets/x86/64/*-squashfs-combined*.img.gz ../$FIRMWARE_DIR/
          cp -v bin/targets/x86/64/sha256sums ../$FIRMWARE_DIR/ 2>/dev/null || true
          cd ../$FIRMWARE_DIR
          # 为每份镜像生成独立 sha256 校验文件
          for f in *.img.gz; do
            [ -e "$f" ] && sha256sum "$f" > "$f.sha256"
          done
          echo "===== 最终发布文件 ====="
          ls -lh

      # ---------- 步骤 16：生成 Release 发布说明（LAN IP、账号密码、版本、插件清单）----------
      - name: 16. 生成 Release 发布说明
        run: |
          bash scripts/release-info.sh openwrt $FIRMWARE_DIR
          echo "===== 发布说明预览 ====="
          cat release-notes.md

      # ---------- 步骤 17：上传固件到 Artifacts（临时存档，无需进 Release 即可下载）----------
      - name: 17. 上传固件到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_TAG }}
          path: ${{ env.FIRMWARE_DIR }}/*
          retention-days: 30

      # ---------- 步骤 18：自动创建 GitHub Release 发布固件镜像 ----------
      - name: 18. 发布固件到 GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            firmware/*.img.gz
            firmware/*.sha256
